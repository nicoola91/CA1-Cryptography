
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SecureVault</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-page">

    <main class="auth-card">

        <div class="brand">
            <div class="brand-icon">S</div>
            <span>SecureVault</span>
        </div>

        <h1>Welcome back!</h1>
        <p class="subtitle">Sign in to access your secure files.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form id="loginForm" method="POST" action="{{ url_for('auth.login') }}">

            <label for="email">Email address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="btn-primary" id="loginButton">
                Sign In
            </button>

            <p id="loginStatus" role="status"></p>

        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}">Create an account</a>
        </p>

    </main>

    <script src="{{ url_for('static', filename='js/encryption.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>

</body>
</html>
