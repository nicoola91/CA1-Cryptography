
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Sets the character format so text and symbols display correctly -->
    <meta charset="UTF-8">

    <!-- Makes the page fit different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Sets the title shown in the browser tab -->
    <title>Login | SecureVault</title>

    <!-- Loads the CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-page">

    <!-- Main section containing the login form -->
    <main class="auth-card">

        <!-- Displays the SecureVault logo and name -->
        <div class="brand">
            <div class="brand-icon">S</div>
            <span>SecureVault</span>
        </div>

        <!-- Main heading -->
        <h1>Welcome back!</h1>

        <p class="subtitle">Sign in to access your secure files.</p>

        <!-- Displays messages sent from Flask -->
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <!-- Login form -->
        <form id="loginForm" method="POST" action="{{ url_for('auth.login') }}">

            <!-- Email input -->
            <label for="email">Email address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="username"
                required
            >

            <!-- Password input -->
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <!-- Login button -->
            <button type="submit" class="btn-primary" id="loginButton">
                Sign In
            </button>

            <!-- Displays login errors or status messages -->
            <p id="loginStatus" role="status"></p>

        </form>

        <!-- Link to registration page -->
        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}">Create an account</a>
        </p>

    </main>

    <!-- Loads the JavaScript encryption functions -->
    <script src="{{ url_for('static', filename='js/encryption.js') }}"></script>

    <script>

        // Finds the login form
        const loginForm = document.getElementById("loginForm");


        // Opens the browser's IndexedDB database
        function openKeyDatabase() {

            return new Promise((resolve, reject) => {

                // Opens the SecureVaultDB database
                const request = indexedDB.open("SecureVaultDB", 1);

                // Creates the database storage area if needed
                request.onupgradeneeded = function(event) {

                    const database = event.target.result;

                    if (!database.objectStoreNames.contains("keys")) {
                        database.createObjectStore("keys");
                    }

                };

                // Runs when the database opens successfully
                request.onsuccess = function(event) {
                    resolve(event.target.result);
                };

                // Runs if the database fails to open
                request.onerror = function() {
                    reject(request.error);
                };

            });

        }


        // Saves the unlocked master encryption key for a specific user
        async function saveMasterKey(userId, key) {

            const database = await openKeyDatabase();

            return new Promise((resolve, reject) => {

                // Opens a transaction that allows information to be saved
                const transaction = database.transaction(
                    ["keys"],
                    "readwrite"
                );

                // Saves the key using the user's ID
                transaction.objectStore("keys").put(
                    key,
                    "masterKey_" + userId
                );

                // Runs when the key has been saved
                transaction.oncomplete = function() {

                    database.close();
                    resolve();

                };

                // Runs if saving the key fails
                transaction.onerror = function() {

                    database.close();
                    reject(transaction.error);

                };

            });

        }


        // Runs when the user submits the login form
        loginForm.addEventListener("submit", async function(event) {

            // Stops the form from refreshing the page
            event.preventDefault();

            // Gets the email entered by the user
            const email = document.getElementById("email").value;

            // Gets the password entered by the user
            const password = document.getElementById("password").value;

            // Gets the login button
            const button = document.getElementById("loginButton");

            // Gets the area where messages are displayed
            const status = document.getElementById("loginStatus");


            try {

                // Disables the button while login is processing
                button.disabled = true;

                // Changes the button text
                button.textContent = "Signing in...";

                // Clears previous messages
                status.textContent = "";


                // Sends the login details to Flask
                const response = await fetch(

                    "{{ url_for('auth.login') }}",

                    {
                        // Sends a POST request
                        method: "POST",

                        // Sends the login details as JSON
                        headers: {
                            "Content-Type": "application/json"
                        },

                        // Allows the browser to send the Flask session cookie
                        credentials: "same-origin",

                        // Converts the login details into JSON
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })

                    }

                );


                // Reads the response from Flask
                const result = await response.json();


                // Checks whether login was successful
                if (!response.ok) {
                    throw new Error(result.error || "Login failed.");
                }


                // Checks that the user ID was returned
                if (!result.user_id) {
                    throw new Error("User ID was not returned by the server.");
                }


                // Uses the password to unlock the master encryption key
                const masterKey = await unlockMasterKey(
                    password,
                    result.encrypted_master_key,
                    result.key_salt,
                    result.key_nonce
                );


                // Saves the unlocked key in IndexedDB
                await saveMasterKey(
                    result.user_id,
                    masterKey
                );


                // Clears the password from the login form
                document.getElementById("password").value = "";


                // Redirects the user to the dashboard
                window.location.href = result.dashboard_url;


            } catch (error) {

                // Prints errors in the browser console
                console.error("Login error:", error);

                // Displays the error on the login page
                status.textContent =
                    error.message || "Unable to sign in.";

                // Allows the user to try logging in again
                button.disabled = false;

                // Changes the button text back
                button.textContent = "Sign In";

            }

        });

    </script>

</body>
</html>
