
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | SecureVault</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="auth-page">

    <main class="auth-card">

        <div class="brand">
            <div class="brand-icon">S</div>
            <span>SecureVault</span>
        </div>

        <h1>Create your account!</h1>
        <p class="subtitle">Securely store and manage your files.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form id="registerForm" method="POST" action="{{ url_for('auth.register') }}">

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Choose a username..."
                autocomplete="username"
                required
            >

            <label for="email">Email address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email..."
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter at least 8 characters"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit" class="btn-primary" id="registerButton">
                Create Account
            </button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{{ url_for('auth.login') }}">Sign in</a>
        </p>

    </main>

    <script src="{{ url_for('static', filename='js/encryption.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>

</body>
</html>
